<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Emira 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styel.css">
</head>
<body class="off">

<div id="cute"></div>
<span class="hop" style="left:12%">🐰</span>
<span class="hop" style="right:14%;animation-delay:-.5s">🐻</span>
<span class="hop" style="left:46%;animation-delay:-.8s">🐥</span>

<div class="cloud" style="width:120px;height:34px;top:9%;animation-duration:70s"></div>
<div class="cloud" style="width:90px;height:26px;top:22%;animation-duration:95s;animation-delay:-40s"></div>
<div class="cloud" style="width:150px;height:40px;top:68%;animation-duration:85s;animation-delay:-20s"></div>

<div class="side" style="left:6px;top:38%">🌸</div>
<div class="side" style="right:6px;top:52%;animation-delay:-2s">🌸</div>
<div class="flowers">
  <span>🌸</span><span style="animation-delay:-1s">🌷</span><span style="animation-delay:-2s">🌸</span><span>🌷</span><span style="animation-delay:-1.5s">🌸</span>
</div>

<main class="card" id="card">
  <h1 id="title">Hi Emira 🌸</h1>
  <p id="text">I made this little place just for you. Tap the button, okay?</p>
  <div id="btns"><button id="next">Open ☁️</button></div>
  <div class="hide" id="ask">
    <button id="yes">Yes, I forgive you 💗</button>
    <button id="no">No</button>
  </div>
  <div class="sign">Directed by Mounir Asrih</div>
</main>

<div class="music">
  <button id="on" aria-pressed="false">🎵 On</button>
  <button id="off" aria-pressed="true">🔇 Off</button>
</div>

<script src="script.js"></script>
</body>
</html>
